<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Browse beautiful sky and nature photography from our community">
    <title>Sky Photography Gallery - Browse</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Stylesheet -->
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>
    <div class="gallery-page">
        <!-- Static Background -->
        <div class="static-background"></div>

        <!-- Back Button -->
        <div class="back-btn">
            <a href="index.html" class="btn btn-back">
                ← Back to Upload
            </a>
        </div>

        <!-- Gallery Header -->
        <div class="gallery-header">
            <h1>🌿 Nature Photography Collection</h1>
            <p class="subtitle">Explore stunning sky and nature moments captured by our community</p>
        </div>

        <!-- Empty State -->
        <div id="emptyState" class="empty-state" style="display: none;">
            <h2>📸 No Photos Yet</h2>
            <p>Be the first to share your beautiful sky and nature photography!</p>
            <a href="index.html" class="btn btn-primary">Upload Your Photo</a>
        </div>

        <!-- Gallery Grid -->
        <div id="galleryGrid" class="gallery-grid">
            <!-- Gallery items will be dynamically inserted here -->
        </div>

        <!-- Modal/Lightbox -->
        <div id="modal" class="modal">
            <button id="modalClose" class="modal-close">✕</button>
            <div class="modal-content">
                <div class="modal-image">
                    <img id="modalImg" src="" alt="Gallery Image">
                </div>
                <div class="modal-details">
                    <h2>Photo Details</h2>

                    <div class="detail-item">
                        <div class="detail-label">Clicked by</div>
                        <div class="detail-value" id="modalPhotographer">-</div>
                    </div>

                    <div class="detail-item">
                        <div class="detail-label">Device</div>
                        <div class="detail-value" id="modalDevice">-</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="js/config.js"></script>
    <script src="js/gallery.js"></script>
</body>

</html>
